<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearImpact Nigeria — Your Impact Starts Nearby</title>
    <meta name="description" content="Discover sustainability projects, SDG-aligned opportunities and impactmakers near you across Nigeria." />

    <!-- Fonts: connect early, then load every family in ONE request.
         Only the weights we actually use are listed (each one is a download).
         Fraunces 700-900 (variable)      = hero headline (--font-hero)
         Merriweather 400-900 (variable)  = optional serif headings/quotes (--font-serif)
         Space Grotesk 400-700            = headings (--font-display)
         Inter 400-800                    = body (--font-body)
         IBM Plex Mono 500/600            = stats + badges (--font-mono)
         Not using Merriweather yet? Delete its family=... part to save a download. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Merriweather:wght@400..900&family=Space+Grotesk:wght@400..700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
